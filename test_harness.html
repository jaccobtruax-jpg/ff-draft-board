<!DOCTYPE html><html><head><meta charset="utf-8"><title>harness</title></head>
<body style="background:#111;color:#eee;font-family:monospace">
<script>try{ localStorage.removeItem('ffb-draft-v4'); localStorage.removeItem('ffb-mocks-v1'); }catch(e){}</script>
<iframe id="app" src="index.html" style="width:100%;height:70vh;border:1px solid #333"></iframe>
<script>
const f = document.getElementById('app');
const out = [];
function log(k, ok){ out.push((ok?'PASS':'FAIL') + '  ' + k); }
function finish(){
  const pre = document.createElement('pre');
  pre.textContent = out.join('\n');
  document.body.appendChild(pre);
}
f.onload = () => {
  const w = f.contentWindow, d = w.document;
  const run = () => {
    try {
      // stub dialogs FIRST (headless blocks on confirm/prompt)
      w.confirm = () => true;
      w.prompt = () => null;
      w.alert = () => {};
      // deterministic start: reset BOTH leagues regardless of localStorage residue.
      // NOTE: stReset REPLACES the league object, so re-capture dbg after this block.
      d.querySelector('#gearBtn').click();
      d.querySelectorAll('#settingsLgToggle button')[0].click();
      d.querySelector('#stReset').click();
      d.querySelectorAll('#settingsLgToggle button')[1].click();
      d.querySelector('#stReset').click();
      d.querySelectorAll('#settingsLgToggle button')[0].click();
      d.querySelector('#settingsClose').click();
      // settings toggle does not re-render the main view — force league 0 render
      d.querySelectorAll('#lgToggle button')[0].click();
      const dbg = w.__dbg();
      log('board rows rendered', d.querySelectorAll('tr.player').length > 100);
      log('top200 first player is Allen (sf TE prem)', d.querySelector('tr.player .pname').textContent.includes('Allen'));
      log('next pick call rendered', !!d.querySelector('#nextCall .call-main'));
      log('scarcity 4 positions', d.querySelectorAll('#scarcityBox .sc-item').length === 4);
      log('expert lists populated', dbg.data.players[Object.keys(dbg.data.players).find(k=>dbg.data.players[k].tags.sleeper)].tags.sleeper.length > 10);
      log('rookie watch populated', dbg.data.rookies.length >= 20);
      // 1. draft a player via ✓ while hide-drafted is ON (default) -> row disappears
      const chk = d.querySelector('tr.player:not(.drafted) .mk.chk');
      const pid = chk.closest('tr').dataset.id;
      chk.click();
      log('drafted count 1', Object.keys(dbg.L.drafted).length === 1);
      log('drafted row hidden by default', !d.querySelector(`tr.player[data-id="${pid}"]`));
      // un-hide to verify the drafted class
      const hd = d.querySelector('#hideDrafted');
      hd.checked = false; hd.dispatchEvent(new w.Event('change', {bubbles:true}));
      const prow = d.querySelector(`tr.player[data-id="${pid}"]`);
      log('row shows drafted class when visible', !!prow && prow.classList.contains('drafted'));
      hd.checked = true; hd.dispatchEvent(new w.Event('change', {bubbles:true}));
      log('draft log has 1 row', d.querySelectorAll('#draftLog .log-row').length === 1);
      log('next pick advanced', dbg.L.drafted[pid].pickNum > 0);
      // 2. star a player
      d.querySelector('tr.player .mk.star').click();
      log('my guys star added', dbg.L.stars.length === 1);
      log('guys box shows player', d.querySelectorAll('#guysBox .ctx-item').length >= 1);
      // 3. switch league
      d.querySelectorAll('#lgToggle button')[1].click();
      const dbg2 = w.__dbg();
      log('league switched to 1', dbg2.ui.league === 1);
      log('scoring label HALF (lg2)', d.querySelector('#scoringLabel').textContent.includes('HALF'));
      log('league 2 draft state separate', Object.keys(dbg2.L.drafted).length === 0);
      // 4. search
      const sb = d.querySelector('#searchBox');
      sb.value = 'Bijan'; sb.dispatchEvent(new w.Event('input', {bubbles:true}));
      const rows = d.querySelectorAll('tr.player');
      log('search narrows to Bijan (kept Bowers stays hidden)', rows.length === 1 && rows[0].querySelector('.pname').textContent.includes('Bijan'));
      // 5. TE tab
      sb.value = ''; sb.dispatchEvent(new w.Event('input', {bubbles:true}));
      d.querySelector('#posTabs button[data-pos="TE"]').click();
      const teRows = d.querySelectorAll('tr.player');
      log('TE tab rows', teRows.length > 10);
      log('TE tab has tier bands', d.querySelectorAll('tr.tierband').length >= 3);
      log('TE tab hides kept Bowers', !d.querySelector('tr.player[data-id="'+Object.keys(dbg.data.players).find(k=>dbg.data.players[k].n.includes('Bowers'))+'"]'));
      // 6. detail modal
      teRows[0].click();
      log('detail modal opens', d.querySelector('#detailBg').classList.contains('open'));
      log('detail has blurb', d.querySelector('#ddBlurb').textContent.length > 50);
      log('detail has projections', d.querySelector('#ddProj').textContent.includes('Rec'));
      log('detail has actions', d.querySelectorAll('#ddActions button').length >= 2);
      // 7. sort by value
      d.querySelector('#ddClose').click();
      d.querySelector('#sortSel').value = 'value';
      d.querySelector('#sortSel').dispatchEvent(new w.Event('change', {bubbles:true}));
      log('value sort runs', d.querySelectorAll('tr.player').length > 10);
      // 8. settings modal (switch to league 0 to assert its SF roster prefill)
      d.querySelector('#gearBtn').click();
      log('settings opens', d.querySelector('#settingsBg').classList.contains('open'));
      d.querySelectorAll('#settingsLgToggle button')[0].click();
      log('settings roster prefilled', d.querySelector('#stRoster').value === '1,2,2,1,2,1,1,1,1,10,3');
      // restore league 0 + clear drafted (replaces league object -> re-capture below)
      d.querySelector('#stReset').click();
      log('state reset works', Object.keys(w.__dbg().L.drafted).length === 0);
      d.querySelector('#settingsClose').click();
      d.querySelectorAll('#lgToggle button')[0].click();
      // ============ INTEL BAR (draft-day intel) ============
      const di = w.__dbg();
      const lg0 = di.leagues[0];
      log('intel bar has chips', d.querySelectorAll('#intelBar .pickchip').length >= 3);
      log('on the clock starts at pick 1', /On the clock · Pick 1/.test(d.querySelector('#intelBar .ib-status').textContent));
      // mark 2 more picks -> sequential numbering 1,2,3 and clock advances
      const hd2 = d.querySelector('#hideDrafted');
      hd2.checked = false; hd2.dispatchEvent(new w.Event('change', {bubbles:true}));
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      log('sequential pick numbers 1..3', di.L.log.length === 3 && di.L.log.map(e=>e.pickNum).join(',') === '1,2,3');
      log('on the clock advances to pick 4', /Pick 4/.test(d.querySelector('#intelBar .ib-status').textContent));
      log('at-risk target chips render', d.querySelectorAll('#intelBar .rchip').length >= 3);
      // run detection: seed 3 TE picks via state + re-render
      const teIds = Object.keys(di.data.players).filter(k=>di.data.players[k].p==='TE').slice(0,3);
      lg0.drafted = {}; lg0.log = [];
      teIds.forEach((id,i)=>{ lg0.drafted[id]={pickNum:i+1, team:'', pick:'', amount:null}; lg0.log.push({pickNum:i+1, team:'', pid:id, amount:null}); });
      di.render();
      log('run banner shows TE run', /TE run — 3 of last 3/.test(d.querySelector('#intelBar .ib-status').textContent));
      // bye clusters: 2 starters sharing a bye week (seed with real player KEYS)
      const rbEnt = Object.entries(di.data.players).filter(([id,p])=>p.p==='RB' && p.b);
      const grp = {};
      rbEnt.forEach(([id,p])=> (grp[p.b]=grp[p.b]||[]).push([id,p]));
      const pair = Object.values(grp).find(g=>g.length>=2).slice(0,2);
      lg0.drafted = {}; lg0.log = [];
      pair.forEach(([id,p],i)=>{ lg0.drafted[id]={pickNum:i+1, team:'', pick:'', amount:null}; lg0.log.push({pickNum:i+1, team:'', pid:id, amount:null}); });
      di.render();
      log('bye cluster warns', /starters.*bye week/.test(d.querySelector('#byeWarn').textContent));
      log('roster rows show bye chips', d.querySelectorAll('#rosterBox .bye').length >= 2);
      // draft order: team names follow pick 1..N in round 1
      lg0.order = ['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel','India','Juliet'];
      lg0.drafted = {}; lg0.log = [];
      di.render();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      log('log teams follow draft order', ['Alpha','Bravo','Charlie'].every((t,i)=> di.L.log[i].team===t));
      // modal: at-a-glance strip + collapsed notes
      lg0.drafted = {}; lg0.log = []; di.render();
      d.querySelector('tr.player:not(.drafted) .pname').click();
      log('quick strip has tier + bye', /Tier \d/.test(d.querySelector('#ddQuick').textContent) && /bye \d+/.test(d.querySelector('#ddQuick').textContent));
      log('notes collapsed by default', d.querySelector('#ddBlurb').style.display === 'none');
      const bbtn = d.querySelector('#ddBlurbBtn');
      log('notes toggle present', bbtn.style.display !== 'none');
      bbtn.click();
      log('notes expand on toggle', d.querySelector('#ddBlurb').style.display === 'block');
      d.querySelector('#ddClose').click();
      lg0.order = []; lg0.drafted = {}; lg0.log = []; di.render();
    } catch(e) { log('EXCEPTION: ' + e.message + '\n' + (e.stack||'').split('\n').slice(0,3).join(' | '), false); }
    setTimeout(runPD, 50);
  };
  // ============ PRE-DRAFT + WHO-DRAFTED-WHO ============
  const runPD = () => {
    try{
      if(!w.__dbg().MOCKS || !w.__dbg().MOCKS.mocks.length){
        return setTimeout(runPD, 200);
      }
      // pre-draft mode
      d.querySelector('#modeToggle button[data-mode="pre"]').click();
      log('predraft view visible', d.querySelector('#predraft').style.display !== 'none');
      log('predraft sample banner', /SAMPLE/.test(d.querySelector('#pdBanner').textContent));
      log('predraft heatmap rows', d.querySelectorAll('table.heat tr').length >= 5);
      log('predraft locked-in guys', d.querySelectorAll('#pdMyBody .lock-row').length >= 3);
      log('predraft manager map rows', d.querySelectorAll('#pdMapBody .mgr-map-row').length === 10);
      log('predraft around-my-picks', d.querySelectorAll('#pdIntelBody .amp-row').length >= 5);
      log('predraft run-risk rows', d.querySelectorAll('#pdIntelBody .runrow').length >= 5);
      d.querySelector('#modeToggle button[data-mode="day"]').click();
      log('draft day restored', d.querySelector('#main').style.display !== 'none');
      // who-drafted-who with real manager names (matches sample corpus for mock sigs)
      const dp = w.__dbg();
      const lgA = dp.leagues[0];
      lgA.order = ['Mothership','Gare-e Bears','Dolphin fans are gay','I Chase Brown Kids','Kirk-umsized Penix','Commander in Children','OJ did it?','Team Name TBD',"Sandusky's Home of TEs",'Ankle Breakers Anonymous'];
      lgA.drafted = {}; lgA.log = []; dp.render();
      const hdA = d.querySelector('#hideDrafted');
      hdA.checked = false; hdA.dispatchEvent(new w.Event('change', {bubbles:true}));
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      d.querySelector('tr.player:not(.drafted) .mk.chk').click();
      log('who-drafted teams follow order', ['Mothership','Gare-e Bears','Dolphin fans are gay'].every((t,i)=> dp.L.log[i].team===t));
      log('log team editable', d.querySelectorAll('#draftLog .team-edit').length === 3);
      d.querySelectorAll('#draftLog .team-edit')[1].click();
      const sel = d.querySelector('#draftLog .inline-sel');
      log('team select opens', !!sel);
      if(sel){
        sel.value = 'OJ did it?';
        sel.dispatchEvent(new w.Event('change', {bubbles:true}));
      }
      log('team reassigned', dp.L.log[1].team === 'OJ did it?');
      log('managers panel rows', d.querySelectorAll('#mgrBox .mgr-row').length === 10);
      log('managers show needs', d.querySelectorAll('#mgrBox .mgr-row .need').length >= 1);
      log('mock sigs in managers panel', /mock/.test(d.querySelector('#mgrBox').textContent));
      log('intel chips show team + need', /I Chase Brown Kids/.test(d.querySelector('#intelBar').textContent) && /needs RB/.test(d.querySelector('#intelBar').textContent));
      // modal who-select
      d.querySelector('tr.player:not(.drafted) .pname').click();
      log('modal who-select has managers', d.querySelectorAll('#ddWho option').length === 11);
      log('modal who defaults to on-clock', d.querySelector('#ddWho').value === 'I Chase Brown Kids');
      d.querySelector('#ddClose').click();
      // settings draft-order prefill
      d.querySelector('#gearBtn').click();
      d.querySelector('#stOrderFill').click();
      log('draft order prefill', d.querySelector('#stOrder').value.split(',').length === 10);
      d.querySelector('#settingsClose').click();
      // ============ LIVE MODE + REAL LEAGUE 1 ============
      const dq = w.__dbg();
      log('L1 real: League of Champs 10 teams slot 3', dq.leagues[0].name === 'League of Champs' && dq.leagues[0].teams === 10 && dq.leagues[0].slot === 3);
      log('L1 real draft order', dq.leagues[0].order.length === 10 && dq.leagues[0].order[0] === 'Mothership' && dq.leagues[0].order[2] === 'Dolphin fans are gay');
      log('L1 handles all 10', Object.keys(dq.leagues[0].handles||{}).length === 10 && dq.leagues[0].handles['Mothership'] === '@aws1990');
      const lgL = dq.leagues[0];
      lgL.drafted = {}; lgL.log = []; dq.render();
      const liveBtn = d.querySelector('#liveBtn');
      log('live button in header', !!liveBtn);
      liveBtn.click();
      log('live mode on: body.live + UI.live', d.body.classList.contains('live') && dq.ui.live === true);
      log('live bar pick 1 = Mothership', d.querySelector('#lbPickN').textContent === '1' && /Mothership/.test(d.querySelector('#lbTeam').textContent));
      log('live bar next 3 picks', /Gare-e Bears/.test(d.querySelector('#lbNext').textContent) && /I Chase Brown Kids/.test(d.querySelector('#lbNext').textContent));
      const hdL = d.querySelector('#hideDrafted');
      hdL.checked = false; hdL.dispatchEvent(new w.Event('change', {bubbles:true}));
      const qk = d.querySelector('tr.player:not(.drafted) .qk-take');
      log('quick TAKEN in live mode', !!qk);
      if(qk) qk.click();
      log('live mark → Mothership + advance', dq.L.log[0] && dq.L.log[0].team === 'Mothership' && d.querySelector('#lbPickN').textContent === '2' && /Gare-e Bears/.test(d.querySelector('#lbTeam').textContent));
      d.querySelector('tr.player:not(.drafted) .pname').click();
      log('modal who locked in live', d.querySelector('#ddWho').disabled === true && d.querySelector('#ddWho').value === 'Gare-e Bears');
      log('live hint in modal', /Draft is live/.test(d.querySelector('#ddWhoRow').textContent));
      d.querySelector('#ddClose').click();
      liveBtn.click();
      log('live off restores manual', d.body.classList.contains('live') === false && dq.ui.live === false);
      d.querySelector('tr.player:not(.drafted) .pname').click();
      log('modal who enabled when off', d.querySelector('#ddWho').disabled === false);
      d.querySelector('#ddClose').click();
      log('managers panel shows handles', /@aws1990/.test(d.querySelector('#mgrBox').textContent));
      // ============ KEEPERS (League of Champs) ============
      const lgK = dq.leagues[0];
      lgK.log = []; lgK.drafted = {}; dq.render();
      const hd0 = d.querySelector('#hideDrafted');
      hd0.checked = true; hd0.dispatchEvent(new w.Event('change', {bubbles:true}));
      const allTab0 = d.querySelector('#posTabs button[data-pos="ALL"]');
      if(allTab0) allTab0.click();
      log('10 keepers seeded', Object.keys(lgK.keepers).length === 10);
      const myK = Object.entries(lgK.keepers).filter(([pid,k])=> (k.team||'') === 'Dolphin fans are gay');
      log('my keepers = Javonte 9.3 + Achane 11.3', myK.length === 2 &&
        myK.some(([pid,k])=> /Javonte/.test(dq.data.players[pid].n) && k.rnd===9 && k.pk===3) &&
        myK.some(([pid,k])=> /Achane/.test(dq.data.players[pid].n) && k.rnd===11 && k.pk===3));
      log('kept players hidden by default', Object.keys(lgK.keepers).every(pid => !d.querySelector('tr.player[data-id="'+pid+'"]')));
      log('roster counts my keepers as RBs', dq.rosterFill().RB === 2);
      log('teamNeed counts keepers (Mothership: RB,WR)', /needs RB,WR/.test(dq.teamNeed('Mothership')));
      log('managers panel shows kept players', /Flowers 7.1/.test(d.querySelector('#mgrBox').textContent) && /Pitts 10.10/.test(d.querySelector('#mgrBox').textContent) && /Bowers 6.3/.test(d.querySelector('#mgrBox').textContent));
      const hdK = d.querySelector('#hideDrafted');
      hdK.checked = false; hdK.dispatchEvent(new w.Event('change', {bubbles:true}));
      const keptPid = myK[0][0];
      d.querySelector('tr.player[data-id="'+keptPid+'"] .pname').click();
      log('modal keeper tag with team + pick', /Keeper 9.3/.test(d.querySelector('#ddTags').textContent) && /Dolphin fans are gay/.test(d.querySelector('#ddTags').textContent));
      d.querySelector('#ddClose').click();
      w.prompt = ()=>"5.3";
      const tgt = d.querySelector('tr.player:not(.drafted)');
      const tgtPid = tgt.dataset.id;
      tgt.querySelector('.pname').click();
      d.querySelector('#ddKeeper').click();
      log('keeper added via modal (5.3, auto team)', !!lgK.keepers[tgtPid] && lgK.keepers[tgtPid].rnd===5 && lgK.keepers[tgtPid].pk===3 && lgK.keepers[tgtPid].team==='Mothership');
      d.querySelector('#ddKeeper').click();
      log('keeper removed via modal', !lgK.keepers[tgtPid]);
      d.querySelector('#ddClose').click();
      hdK.checked = true; hdK.dispatchEvent(new w.Event('change', {bubbles:true}));
      // ============ SHARINGAN THEME + DATA UTILIZATION ============
      const dbgT = dq;
      log('sharingan logo in header', !!d.querySelector('#topbar .sharingan'));
      log('live bar has Mangekyō label', /Mangekyō/.test(d.querySelector('#liveBar').textContent));
      const adjSpans = [...d.querySelectorAll('tr.player .adp-adj')];
      log('keeper-adjusted ADP shown', adjSpans.length > 0);
      log('effective ADP < raw ADP', (()=>{
        const s = adjSpans[0]; if(!s) return false;
        const raw = parseFloat(s.closest('tr').querySelector('.adp').childNodes[0].textContent);
        const eff = parseFloat(s.textContent.replace(/eff /,''));
        return eff > 0 && eff < raw;
      })());
      log('upside indicator on rows', !!d.querySelector('tr.player:not(.drafted) .ups'));
      const ss = d.querySelector('#sortSel');
      ss.value = 'upside'; ss.dispatchEvent(new w.Event('change', {bubbles:true}));
      const upsRows = [...d.querySelectorAll('tr.player:not(.drafted)')].slice(0,3);
      log('upside sort: first >= second', (()=>{
        const g = r => parseFloat(r.querySelector('.ups').textContent.replace('▲',''));
        return g(upsRows[0]) >= g(upsRows[1]);
      })());
      ss.value = 'vbd'; ss.dispatchEvent(new w.Event('change', {bubbles:true}));
      const vbdRows = [...d.querySelectorAll('tr.player:not(.drafted)')].slice(0,3);
      log('vbd sort: first >= second', (()=>{
        const g = r => dbgT.vbdFor(dbgT.data.players[r.dataset.id]) ?? -999;
        return g(vbdRows[0]) >= g(vbdRows[1]);
      })());
      ss.value = 'ffb'; ss.dispatchEvent(new w.Event('change', {bubbles:true}));
      const am2 = dbgT.auctionMap();
      const aucPid = Object.keys(am2).find(pid => am2[pid] > 0 && !dbgT.isDrafted(pid) && d.querySelector('tr.player[data-id="'+pid+'"]'));
      if(aucPid){ d.querySelector('tr.player[data-id="'+aucPid+'"] .pname').click();
        log('auction $ in modal', new RegExp('Auc \\$' + am2[aucPid]).test(d.querySelector('#ddQuick').textContent));
        d.querySelector('#ddClose').click();
      } else log('auction $ in modal', false);
      d.querySelector('.expander[data-x="injuryBox"]').click();
      const injF2 = d.querySelector('#injuryFilter');
      log('injury report searchable', !!injF2);
      if(injF2){
        const before = d.querySelectorAll('#injuryList div').length;
        injF2.value = 'knee'; injF2.dispatchEvent(new w.Event('input', {bubbles:true}));
        const hits = [...d.querySelectorAll('#injuryList div')].map(x=>x.textContent.toLowerCase());
        log('injury filter narrows to matches', before > 0 && hits.length <= before && hits.length > 0 && hits.every(t=>t.includes('knee')));
      } else log('injury filter narrows to matches', false);
      d.querySelector('.expander[data-x="injuryBox"]').click();
      d.querySelector('.expander[data-x="udkBox"]').click();
      log('UDK analysis notes populated', d.querySelector('#udkBox').textContent.length > 100);
      // ============ SHARINGAN READ ============
      const lgR = dq.leagues[0];
      lgR.drafted = {}; lgR.log = []; lgR.stars = [];
      dq.render();
      const hdR = d.querySelector('#hideDrafted');
      hdR.checked = false; hdR.dispatchEvent(new w.Event('change', {bubbles:true}));
      d.querySelector('#posTabs button[data-pos="WR"]').click();
      for(let i=0;i<3;i++){ const b = d.querySelector('tr.player:not(.drafted) .mk.chk'); if(b) b.click(); }
      const readRun = dq.sharinganRead();
      log('read: WR run detected in call data', readRun.scored.some(c=>c.pos==='WR' && c.chips.includes('run WR ×3')));
      log('read: need/upgrade chips shown', /need/.test(d.querySelector('#nextCall').textContent) && /upgrade/.test(d.querySelector('#nextCall').textContent));
      log('read: league context (ahead teams + needs)', readRun.ahead.length >= 5 && (readRun.needCount.WR||0) >= 1 && readRun.scored.length >= 3);
      log('read: league format factored (TE-prem/SF)', readRun.scored.some(c=>c.chips.includes('TE-prem')) && readRun.scored.some(c=>c.chips.includes('SF QB')));
      log('read: analyst tags carried on tagged candidates', readRun.scored.filter(c=>Object.keys(c.p.tags||{}).length).every(c=>/sleeper|breakout|value pick|bust/.test(c.chips.join(' '))));
      log('read: tier cliffs computed', Object.keys(readRun.cliffs).length === 4 && readRun.cliffs.RB >= 0);
      log('read: survival is probabilistic (0..1)', readRun.scored.every(c=>c.survival>=0 && c.survival<=1));
      const top200b = dq.data.rankings['TE PREM (4pt QB)'].top200;
      const used = new Set([...Object.keys(lgR.drafted), ...Object.keys(lgR.keepers)]);
      let added = 0;
      for(const r of top200b){
        if(used.has(r[0])) continue;
        const n = 4 + added;
        lgR.drafted[r[0]] = { pick: '', pickNum: n, team: dq.teamAtPick(n) };
        lgR.log.push({ pickNum: n, team: dq.teamAtPick(n), pid: r[0], amount: null });
        if(++added === 14) break;
      }
      dq.render();
      log('read: survival horizon shown in call', /% gone|coin flip|gone by|\d+%/.test(d.querySelector('#nextCall').textContent));
      log('read display: survival bar rendered', (()=>{ const f = d.querySelector('#nextCall .surv-bar .surv-fill'); const w = f && parseFloat(f.style.width); return !!f && w>=0 && w<=100; })());
      log('read display: gain + score stats', /\+(\d+)pts/.test(d.querySelector('#nextCall .read-row').textContent) && /\/100/.test(d.querySelector('#nextCall').textContent));
      log('read display: mode badge', /NEED|UPGRADE/.test(d.querySelector('#nextCall .mode-badge').textContent));
      log('read display: alt survival mini-bars', d.querySelectorAll('#nextCall .alt-line .surv-mini').length >= 1);
      const starPid = dq.sharinganRead().primary.pid;
      lgR.stars = [String(starPid)];
      dq.render();
      log('read: ★ my guy chip', /★ my guy/.test(d.querySelector('#nextCall').textContent));
      lgR.stars = [];
      const read2 = dq.sharinganRead();
      log('read: pool + picks intact after fill', read2.scored.length >= 3 && read2.myNext === 18);
      const tf = d.querySelector('#tagFilter');
      tf.value = 'sleeper'; tf.dispatchEvent(new w.Event('change', {bubbles:true}));
      const sleeperRows = [...d.querySelectorAll('tr.player:not(.drafted)')];
      log('board tags filter: only sleeper-tagged', sleeperRows.length > 0 && sleeperRows.every(r=> (dq.data.players[r.dataset.id].tags||{}).sleeper));
      tf.value = ''; tf.dispatchEvent(new w.Event('change', {bubbles:true}));
      d.querySelector('#posTabs button[data-pos="ALL"]').click();
      hdR.checked = true; hdR.dispatchEvent(new w.Event('change', {bubbles:true}));
      // ============ MY GUYS PRESET (2026-ONLY) ============
      await new Promise(r=>setTimeout(r, 120));
      lgR.drafted = {}; lgR.log = []; dq.render();
      const mg = d.querySelector('#myGuysPreset');
      log('myguys: preset select + host options', !!mg && mg.querySelectorAll('option').length === 5);
      log('myguys: 2026-only guard (no 2025 data anywhere)', (()=>{ const pr = dq.MYGUYS.presets; const all = Object.values(pr).map(p=>p.source).join(' '); return Object.keys(pr).every(k=>k==='udk2026') && !/2025/.test(all) && /2026/.test(all); })());
      log('myguys: data loaded with resolved ids', (()=>{ const p = dq.MYGUYS.presets.udk2026; return !!p && p.players.length === 10 && p.players.every(x=>x.id); })());
      log('myguys: host options disabled until 2026 data exists', mg.querySelector('option[value="mike"]').disabled && mg.querySelector('option[value="jason"]').disabled && mg.querySelector('option[value="andy"]').disabled);
      mg.value = 'udk2026'; mg.dispatchEvent(new w.Event('change', {bubbles:true}));
      log('myguys: applying udk2026 sets stars', (()=>{ const st = dq.L.stars; const ids = dq.MYGUYS.presets.udk2026.players.map(x=>String(x.id)); return st.length === ids.length && ids.every(i=>st.includes(i)); })());
      const og = d.querySelector('#onlyGuys');
      og.checked = true; og.dispatchEvent(new w.Event('change', {bubbles:true}));
      const starRows = [...d.querySelectorAll('tr.player:not(.drafted)')];
      log('myguys: only-guys board shows preset players', starRows.length >= 3 && starRows.every(r=> dq.L.stars.includes(String(r.dataset.id))));
      og.checked = false; og.dispatchEvent(new w.Event('change', {bubbles:true}));
      log('myguys: preset choice persists', dq.ui.myGuysPreset === 'udk2026');
      mg.value = ''; mg.dispatchEvent(new w.Event('change', {bubbles:true}));
      log('myguys: clearing preset resets stars', dq.L.stars.length === 0 && dq.ui.myGuysPreset === null);
    } catch(e){ log('PD EXCEPTION: ' + e.message + '\n' + (e.stack||'').split('\n').slice(0,3).join(' | '), false); }
    finish();
  };
  // poll until the app has rendered (live CDN fetch of board.json can be slow)
  const t0 = Date.now();
  const iv = setInterval(() => {
    if(d.querySelector('#gearBtn') && d.querySelector('tr.player')){
      clearInterval(iv); setTimeout(run, 300);
    } else if(Date.now() - t0 > 20000){
      clearInterval(iv); log('app failed to render in 20s', false); finish();
    }
  }, 150);
};
</script></body></html>
